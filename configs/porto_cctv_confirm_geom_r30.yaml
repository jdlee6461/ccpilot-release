# POST-HOC (review M3, 2026-10-01): observation radius 30 m (merge radius 30 m); otherwise the confirmation settings
# (configs/porto_cctv_confirm.yaml, not edited), held-out period only, primary predictor, reduced method set.
# Generated by posthoc_geometry.py; trajectories reused from the confirmation run.
dataset: porto
timezone: Europe/Lisbon
work_dir: work/porto_cctv_confirm_geom_r30
out_dir: results/porto_cctv_confirm_posthoc/geometry/r30
porto:
  csv_path: data/porto/train.csv
  start_date: '2014-05-05'
  end_date: '2014-07-01'
  proj_center:
  - -8.61
  - 41.15
  bbox:
  - -8.7
  - 41.1
  - -8.55
  - 41.2
  gps_interval_s: 15
  max_speed_mps: 50
  chunksize: 100000
  max_trips: null
  reuse_trajectories: work/porto_cctv_confirm/trajectories.parquet
cameras:
  geojson: data/porto/porto_cctv.json
  merge_radius_m: 30
  exclude_tunnel: true
events:
  camera_radius_m: 30
  interp_step_s: 1.0
  max_overlap: 4
  t_max_s: 600
  bin_s: 5
  hour_group_edges:
  - 0
  - 6
  - 10
  - 16
  - 20
  - 24
eval:
  seed: 0
  target_recall: 0.95
  candidate_radius_m: 2500
  predictors:
    src_zone_hour_speed:
    - src
    - zone
    - hgroup
    - speed_bin
  confound_predictor: src_zone
  model:
    lam: 20.0
    eps: 0.0001
    sigma_bins: 1.0
  spatula:
    s_thresh: 0.05
    t_quantile: 0.98
  mondrian:
    mondrian_hour_hop_speed:
    - hgroup
    - hopfirst
    - speed_bin
  min_group_n: 200
  aci:
    window: 2000
    feedback_fraction: 0.3
  aci_variants:
  - name: aci_g0005
    gamma: 0.0005
    alpha_floor: -0.5
  multigroup:
    predictors:
    - src_zone_hour_speed
    dims:
    - hgroup
    - hopkind
    - speed_bin
    - zone
    - entropy_bin
    - nn_bin
    mvp_variants:
    - name: mvp_log
      scale: log
      m: 40
      a_min: 0.002
    - name: mvp_global
      scale: quantile
      m: 40
      global_only: true
    qr_max_n: 80000
    qr_ogd:
      gamma: 0.005
      clip: 3.0
  strata:
  - hgroup
  - hopfirst
  - hopkind
  - zone
  - speed_bin
  - entropy_bin
  - nn_bin
  n_spatial_bins: 4
  group_bar: 0.94
  n_speed_bins: 4
  dip_margin: 0.05
  plot_methods:
  - static
  - aci_g0005
  - mvp_log
  - qr_ogd
  splits:
    train:
    - '2014-05-05'
    - '2014-06-02'
    cal:
    - '2014-06-02'
    - '2014-06-09'
    test:
    - name: test_jun_a
      range:
      - '2014-06-09'
      - '2014-06-21'
    - name: test_jun_b
      range:
      - '2014-06-21'
      - '2014-07-01'
  max_hops: 10
  rolling_window: 1000
  save_hits: true
  save_scores:
    tau_min_levels:
    - 0.002
