# Porto taxi (ECML/PKDD 2015). Natural shift candidate: Christmas / New Year holidays.
# Check the dataset's actual date coverage before running.
dataset: porto
timezone: Europe/Lisbon
work_dir: work/porto
out_dir: results/porto

porto:
  csv_path: data/porto/train.csv
  start_date: "2013-11-04"
  end_date: "2014-01-06"
  proj_center: [-8.61, 41.15]        # lon0, lat0 for local metric projection
  bbox: [-8.70, 41.10, -8.55, 41.20] # keep trips touching central Porto (adjust)
  gps_interval_s: 15
  max_speed_mps: 50
  chunksize: 100000
  max_trips: null                     # e.g. 20000 for a quick first run

cameras:
  csv: null                           # or a CSV with cam_id,x,y (local metres)
  n_cameras: 130                      # Spatula used 130 cameras for Porto (verify)
  min_spacing_m: 300
  cell_m: 50
  region_xy: [-7500, -5500, 5000, 5500]  # x0,y0,x1,y1 in metres around proj_center (adjust)

events:
  camera_radius_m: 50
  interp_step_s: 1.0
  max_overlap: 4
  t_max_s: 600
  bin_s: 5
  hour_group_edges: [0, 6, 10, 16, 20, 24]

eval:
  seed: 0
  target_recall: 0.95
  candidate_radius_m: 2500
  predictors:            # name -> conditioning levels (hierarchical, coarse -> fine)
    src: [src]
    src_zone: [src, zone]
    src_zone_hour: [src, zone, hgroup]
    src_zone_speed: [src, zone, speed_bin]
    src_zone_hour_speed: [src, zone, hgroup, speed_bin]
  confound_predictor: src_zone
  model: {lam: 20.0, eps: 1.0e-4, sigma_bins: 1.0}
  spatula: {s_thresh: 0.05, t_quantile: 0.98}
  # conditional (Mondrian) calibration: name -> columns defining groups
  mondrian:
    mondrian_hour: [hgroup]
    mondrian_hop: [hopfirst]
    mondrian_hour_hop: [hgroup, hopfirst]
    mondrian_speed: [speed_bin]
    mondrian_hour_hop_speed: [hgroup, hopfirst, speed_bin]   # 40 cells: partition approach at its limit
  min_group_n: 200                      # groups smaller than this fall back to global tau
  aci:
    window: 2000
    feedback_fraction: 0.3
  # adaptive variants; alpha_floor: number or "alpha/k"; -0.5 = effectively no floor
  aci_variants:
    - {name: aci_g001,          gamma: 0.001,  alpha_floor: -0.5}
    - {name: aci_g0005,         gamma: 0.0005, alpha_floor: -0.5}
    - {name: aci_hophour_g001f, gamma: 0.001,  alpha_floor: "alpha/5", groups: [hgroup, hopfirst]}
  # overlapping-group calibration (no cell products): MVP (online) and group QR (offline)
  multigroup:
    predictors: [src_zone_speed, src_zone_hour_speed]
    dims: [hgroup, hopkind, speed_bin, zone, entropy_bin, nn_bin]   # 25 overlapping groups
    mvp_variants:
      - {name: mvp_groups, scale: quantile, m: 40}             # previous version (uniform buckets)
      - {name: mvp_log,    scale: log, m: 40, a_min: 0.002}    # log-scale buckets + capped extreme
      - {name: mvp_global, scale: quantile, m: 40, global_only: true}
    qr_max_n: 80000
    qr_ogd: {gamma: 0.005, clip: 3.0}                          # QR start + online group updates
  # strata for conditional / worst-group coverage
  strata: [hgroup, hopfirst, hopkind, zone, speed_bin, entropy_bin, nn_bin]
  n_spatial_bins: 4
  group_bar: 0.94                       # worst-group bar used for 'n_groups_sig_below_bar'
  n_speed_bins: 4
  dip_margin: 0.05                      # frac_below = share of rolling windows below target - margin
  plot_methods: [static, mondrian_hour_hop_speed, aci_g0005, mvp_groups, mvp_log, qr_groups, qr_ogd]
  splits:
    train: ["2013-11-04", "2013-12-02"]
    cal:   ["2013-12-02", "2013-12-09"]
    test:
      - {name: test_same,    range: ["2013-12-09", "2013-12-23"]}
      - {name: test_holiday, range: ["2013-12-23", "2014-01-06"]}
  max_hops: 10
  rolling_window: 1000
